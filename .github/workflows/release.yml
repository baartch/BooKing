name: Release package

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build JavaScript
        run: bun run build

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          test -s app/public/js/map.js

          package_dir="$(mktemp -d "$RUNNER_TEMP/booking-package.XXXXXX")"
          cp -R app assets sql index.php favicon.ico .htaccess "$package_dir/"
          mkdir "$package_dir/config"
          cp config/config.example.php config/.htaccess "$package_dir/config/"

          test ! -e "$package_dir/config/config.php"
          test ! -e "$package_dir/node_modules"
          test ! -e "$package_dir/src"

          printf '<?php\n// Generated by the release pipeline. Do not edit.\ndefine(%s, %s);\n' \
            "'APP_VERSION'" "'$RELEASE_TAG'" > "$package_dir/app/version.php"

          # Built outside the package so the walk cannot list itself.
          manifest_tmp="$RUNNER_TEMP/manifest.json.tmp"
          {
            printf '{\n  "version": "%s",\n  "files": {\n' "$RELEASE_TAG"
            first=1
            while IFS= read -r -d '' file; do
              rel="${file#"$package_dir"/}"
              rel="${rel//\\/\\\\}"
              rel="${rel//\"/\\\"}"
              hash="$(sha256sum "$file" | cut -d' ' -f1)"
              if [ "$first" -eq 1 ]; then first=0; else printf ',\n'; fi
              printf '    "%s": "%s"' "$rel" "$hash"
            done < <(find "$package_dir" -type f -print0 | sort -z)
            printf '\n  }\n}\n'
          } > "$manifest_tmp"
          mv "$manifest_tmp" "$package_dir/manifest.json"

          test -s "$package_dir/app/version.php"
          test -s "$package_dir/manifest.json"

          cd "$package_dir"
          zip -qr "$RUNNER_TEMP/BooKing-${RELEASE_TAG}.zip" .
          unzip -tq "$RUNNER_TEMP/BooKing-${RELEASE_TAG}.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/BooKing-${RELEASE_TAG}.zip" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
